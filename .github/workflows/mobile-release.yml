name: Mobile release

# Signed Android APK on GitHub Releases (ADR-0007).
#
#   git tag mobile-v1.0.0 && git push origin mobile-v1.0.0
#
# Stable download link, whatever the version:
#   https://github.com/michynow/openrecipe/releases/latest/download/openrecipe.apk
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: build and publish APK
    runs-on: ubuntu-latest
    env:
      # versionCode rises on every run; versionName is the tag (mobile-v1.2.3 -> 1.2.3).
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Check the API URL is set
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Repository variable EXPO_PUBLIC_API_URL is empty. Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Version name from the tag
        run: |
          if [[ "$GITHUB_REF_NAME" == mobile-v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#mobile-v}" >> "$GITHUB_ENV"
          fi

      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk openrecipe.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" != mobile-v* ]]; then
            echo "Not a mobile-v* tag ($GITHUB_REF_NAME): APK built, no release created."
            exit 0
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" openrecipe.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" openrecipe.apk --title "OpenRecipe ${GITHUB_REF_NAME#mobile-v}" --generate-notes
          fi
